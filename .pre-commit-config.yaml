repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: '\.age$'
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: '\.age$'
      - id: check-yaml
        exclude: '\.tmpl$'
      - id: check-added-large-files
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95  # frozen: v0.11.0.1
    hooks:
      - id: shellcheck
        files: '\.(sh|bash)$'
        exclude: '(^|/)symlink_'
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: 05c1426671b9237fb5e1444dd63aa5731bec0dfb  # frozen: v3.13.1-1
    hooks:
      - id: shfmt
        args:
          - --indent
          - '2'
          - --case-indent
          - --binary-next-line
          - --space-redirects
          - --diff
        files: '\.(sh|bash)$'
        exclude: '(^|/)symlink_'
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 12e63946db2c5cfcc9030fac21c3883ba88c6ed8  # frozen: 0.38.0
    hooks:
      - id: check-jsonschema
        name: validate .chezmoidata.yaml against schema
        files: '^\.chezmoidata\.(yaml|schema\.json)$'
        pass_filenames: false
        args: [--schemafile, .chezmoidata.schema.json, .chezmoidata.yaml]
  - repo: https://github.com/crate-ci/typos
    rev: 8a48f81b6c64dcfea44b3633223084c4be58ac5f  # frozen: v1.49.0
    hooks:
      - id: typos
        # args: [] overrides the upstream default of [--write-changes], which
        # REWRITES FILES IN PLACE. That default is not a theoretical hazard: a
        # trial run of it on this repo renamed `extra-substituters` to
        # `extra-substitutes` in two Nix configs, rewrote a real domain in a
        # WebFetch permission, renamed the Siduction distro, and inserted a
        # character into age ciphertext. Never remove this line.
        #
        # Hook id is `typos` (language: python, prebuilt binary), NOT
        # `typos-src`, which is language: rust and compiles from source.
        #
        # Word allow-list lives in .typos.toml.
        args: []
        # The *.age exclusion has to be here, not only in .typos.toml: that
        # file's files.extend-exclude is applied while typos WALKS a tree, and
        # pre-commit passes filenames explicitly, which bypasses the walk. The
        # .typos.toml glob is kept as the backstop for direct CLI runs.
        exclude: '\.age$'
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint
        # Lints .github/workflows/*.yaml: schema, expression syntax, and
        # matrix / needs wiring. Via shellcheck on PATH it also lints the
        # embedded `run:` scripts, which this repo's own shellcheck hook
        # cannot see (it matches \.(sh|bash)$ and the workflow is .yaml).
        # NOTE: actionlint SILENTLY SKIPS the shellcheck pass when the binary
        # is absent — exit 0, no warning — so a green run would not prove that
        # coverage exists. The CI lint job asserts shellcheck's presence.
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 622e490c2f069b30f6c336350ef23ce247325ab0  # frozen: 44.35.0
    hooks:
      - id: renovate-config-validator
        # Validates .github/renovate.json5. Without this, a typo in a manager
        # name or a broken matchStrings regex fails nothing — Renovate just
        # stops proposing those updates and the pinned externals go stale.
        # language: node with language_version: lts, so pre-commit provisions
        # its own Node; no actions/setup-node needed in the lint job.
  - repo: local
    hooks:
      - id: render-lint-sh-tmpl
        name: render and lint *.sh.tmpl via chezmoi
        language: system
        entry: .dev/lint-bash.sh
        files: '\.sh\.tmpl$'
      - id: check-renovate-digests
        name: enforce digest presence for renovate-tagged externals
        language: system
        entry: .dev/check-renovate-digests.sh
        files: '^\.chezmoiexternal\.toml\.tmpl$'
        pass_filenames: false
      - id: check-paths-git-repos
        name: enforce git_repos entries have a matching paths.<name>_dir
        language: system
        entry: .dev/check-paths.sh --git-repos-only
        files: '^(\.chezmoidata\.yaml|\.dev/check-paths\.sh)$'
        pass_filenames: false
      - id: no-env-template-func
        name: forbid env "..." in templates (use chezmoidata)
        language: pygrep
        entry: '\benv\s+"'
        files: '\.tmpl$'
        # Matches `env "..."` anywhere, including nested inside other funcs
        # (e.g. `(env "CI")`), not just a bare top-level `{{ env "..." }}`.
        # .chezmoi.toml.tmpl legitimately reads runtime env (CI=true) to derive
        # is_ci at chezmoi-init time, before chezmoidata is even loaded. This
        # guard exists to stop path/hostname env usage in managed templates,
        # not to block that one legitimate runtime-env read.
        exclude: '^\.chezmoi\.toml\.tmpl$'
      - id: no-unpinned-actions
        name: forbid tag-pinned GitHub Actions (use commit SHAs)
        language: pygrep
        entry: 'uses:\s*[^@\s]+@(?![0-9a-fA-F]{40}(\s|$))'
        files: '^\.github/(workflows|actions)/.*\.ya?ml$'
        # Supply-chain policy (CLAUDE.md): a tag is mutable and can be
        # repointed by its owner, so every third-party action is pinned to a
        # 40-hex commit SHA with the human-readable version in a trailing
        # comment. Renovate's github-actions manager reads that comment and
        # automerges pin/digest/patch bumps.
        #
        # Flags `uses: owner/repo@<anything-but-40-hex>`. Local (`./...`) and
        # `docker://` refs have no `@ref` and are untouched. A commented-out
        # `uses: ...@v1` is flagged too — deliberate, so a stale line cannot be
        # uncommented back into an unpinned action.
        # .github/actions/ is matched pre-emptively; no composite actions exist yet.
      - id: no-unpinned-precommit-revs
        name: forbid tag-pinned pre-commit revs (use commit SHAs)
        language: pygrep
        entry: '^\s*rev:(?![ \t]*[0-9a-fA-F]{40}([ \t]|$))'
        files: '^\.pre-commit-config\.yaml$'
        # The whitespace after `rev:` lives INSIDE the lookahead on purpose.
        # Written as `rev:\s*(?!...)` the \s* backtracks to zero width, the
        # lookahead then inspects the space instead of the SHA, and every
        # correctly pinned line gets flagged. Unit-tested both ways.
        #
        # Same supply-chain policy as no-unpinned-actions above, applied to
        # this file. Arguably the more important of the two: hooks execute on
        # the developer's machine at commit time with access to ~/.keys and
        # ~/.ssh, whereas an action runs in a disposable runner.
        #
        # Regenerate a rev with:
        #   git ls-remote <repo> refs/tags/<tag> 'refs/tags/<tag>^{}'
        # taking the ^{} (dereferenced) SHA when the tag is annotated.
        #
        # Do NOT use bare `pre-commit autoupdate --freeze` to maintain these.
        # It resolves each repo via `git describe` against the default branch,
        # so a release tagged off-mainline is invisible to it — as of 2026-08
        # that silently DOWNGRADES gitleaks v8.30.1 (lightweight tag, not
        # reachable from main) to v8.30.0, four months older. Renovate owns
        # these bumps; see .github/renovate.json5.
      - id: pgrep-hook-self-test
        name: self-test the pgrep poll-loop PreToolUse hook
        language: system
        entry: dot_config/exact_claude/exact_shared/hooks/executable_block-pgrep-self-match.sh --self-test
        files: '^dot_config/exact_claude/exact_shared/hooks/(executable_block-pgrep-self-match\.sh|pgrep-scan\.awk)$'
        pass_filenames: false
        # A hook that silently stops matching is worse than no hook, so the case
        # table is the regression guard. `files` covers the awk scanner too: a
        # change there breaks classification without touching the bash script.
