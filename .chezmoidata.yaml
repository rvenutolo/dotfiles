---
# Canonical source of host/path facts. Templates read these via `.foo.bar`;
# `dot_config/profile.sh.tmpl` exports them as env vars for shell consumers.
# Paths are home-relative (no leading slash); join with `.chezmoi.homeDir` in
# templates, e.g. `{{ .chezmoi.homeDir }}/{{ .paths.keys_dir }}`.

hostnames:
  personal_desktop: redstar
  personal_laptop: bluestar
  work_laptop: silverstar

paths:
  age_private_key_file: .keys/age.key
  crypt_dir: .crypt
  dotfiles_dir: Projects/Personal/dotfiles
  home_manager_dir: .config/home-manager
  home_manager_packages_dir: .config/home-manager/packages
  keys_dir: .keys
  nix_user_profile: .nix-profile
  packages_dir: Projects/Personal/packages
  personal_projects_dir: Projects/Personal
  personal_ssh_private_key: .keys/id_ed25519
  personal_ssh_public_key: .keys/id_ed25519.pub
  scripts_dir: Projects/Personal/scripts
  work_projects_dir: Projects/Work
  work_ssh_private_key: .keys/id_ed25519
  work_ssh_public_key: .keys/id_ed25519.pub
  xdg_bin_home: .local/bin
  xdg_cache_home: .cache
  xdg_config_home: .config
  xdg_data_home: .local/share
  xdg_projects_dir: Projects
  xdg_state_home: .local/state

# Personal git repos topgrade keeps updated; entries name paths keys —
# `<name>` must have a matching `<name>_dir` under paths. Enforced twice:
# render-time `{{ fail }}` guard in topgrade.toml.tmpl (apply-time backstop;
# CI does not render this target) and `.dev/check-paths.sh --git-repos-only`
# via pre-commit (merge-time enforcement, runs in CI on every push/PR).
git_repos:
  - crypt
  - dotfiles
  - packages
  - scripts

# Editor/pager preference chains, most-preferred first. `profile.sh.tmpl`
# renders these into runtime `command -v` probe chains, so a missing binary
# degrades gracefully instead of exporting a name that is not installed.
# Other templates read the head of a list for the single preferred binary
# (e.g. `[edit]` in `.chezmoi.toml.tmpl`, kitty's `scrollback_pager`).
#
# Entry shape: `bin` (required), `flatpak_id` (optional; probed before `bin`),
# `args` (optional; appended to the exported command).
#
# The LAST entry of `editors.text` and of `pagers` is the unconditional
# fallback: it is assumed present and is exported without a probe.
editors:
  text:
    - bin: micro
    - bin: nano
    - bin: hx
    - bin: nvim
    - bin: vim
    - bin: vi
  # GUI chain. Probed with `__real_cmd` (PATH stripped of the script-repo
  # wrapper dirs) rather than `command -v`, and exported as an absolute path.
  visual:
    - bin: zed
      flatpak_id: dev.zed.Zed
      args: --wait
    - bin: lite-xl
    - bin: kate
      flatpak_id: org.kde.kate
      args: --block

pagers:
  - bin: moor
  - bin: less
    args: --ignore-case

age:
  public_key: age1v9umzaqlw3euuwd20l605qeyqp9cmqxf3flzz0eh9gj5vxslsarq6fy8gs

# SHA-256 of the age ciphertexts fetched by run_once_before_01-get-keys.sh.tmpl
# (hash of the file content as captured by "$(curl ...)" then piped via <<<).
# This matches hashing the file directly (as docs/age-rotation.md does) only
# because armored age output ends with exactly one trailing newline.
# Rotating keys in the crypt repo requires updating these values.
checksums:
  crypt_age_key: 7a7e085779b6356da306b22ef8b2f555000209e742821c421150daf62204d80f
  crypt_id_ed25519: 80e2778ff54a894887100dfc1b2dd3d6e08db9d007b83c550c49b06652a2c9be
  crypt_id_ed25519_pub: 4ac458331095e2acf3a3a472960bb36ed419d40dc6781e7ee2e4744dcc1402b2

weather:
  wttr_city: Atlanta
