# Kernel hardening. NOTE: sysctl-intellij-profiler.conf intentionally sets
# kernel.kptr_restrict = 0 (and perf_event_paranoid = 1) for profiling. On
# hosts where profiling should win, link the profiler conf with a
# later-sorting filename in /etc/sysctl.d/ — last writer wins.
kernel.randomize_va_space = 2
kernel.dmesg_restrict = 1
kernel.kptr_restrict = 2
