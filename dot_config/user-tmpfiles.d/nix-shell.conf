# `nix develop --command X` creates /tmp/nix-shell.XXXXXX as TMPDIR and execs X,
# leaving nothing behind to remove it. /tmp is tmpfs, so leaked dirs consume RAM.
#
# `e` with a glob ages out the *contents* of each matching dir; the dirs
# themselves stay behind empty until reboot clears tmpfs. `R` would remove the
# dirs, but it runs unconditionally at every login and would wipe the TMPDIR of
# a shell still running in a persistent session.
#
# Runs from the user-level systemd-tmpfiles-clean.timer, which must be enabled.
e /tmp/nix-shell.* - - - 1d
