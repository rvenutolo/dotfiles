# TMPDIR (exported by profile.sh) lives on disk under the cache dir instead of
# tmpfs /tmp. `D` creates it and, under `--remove`, empties it. Only the user
# systemd-tmpfiles-setup.service passes `--remove`, and it runs when the user
# manager starts: at boot with linger, otherwise at the first login after every
# session has ended. Either way no live session is using the directory.
#
# That service must be enabled; Ubuntu ships it disabled despite an enabled
# preset.
D %C/tmp 0700 - - -
