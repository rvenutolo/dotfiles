name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install chezmoi
        run: |
          sh -c "$(curl --disable --fail --silent --location --show-error get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Init chezmoi config (runner hostname -> is_server)
        run: |
          mkdir --parents "$(dirname "$HOME/.local/share/chezmoi")"
          ln --symbolic "$GITHUB_WORKSPACE" "$HOME/.local/share/chezmoi"
          chezmoi init
      - name: Install shfmt (needed by the render-lint-sh-tmpl hook)
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.13.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  render:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [redstar, bluestar, silverstar, io]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install chezmoi
        run: |
          sh -c "$(curl --disable --fail --silent --location --show-error get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Become ${{ matrix.host }}
        run: sudo hostnamectl set-hostname '${{ matrix.host }}'
      - name: Init chezmoi config as ${{ matrix.host }}
        run: |
          mkdir --parents "$(dirname "$HOME/.local/share/chezmoi")"
          ln --symbolic "$GITHUB_WORKSPACE" "$HOME/.local/share/chezmoi"
          chezmoi init
      - name: Render every managed target (dry run)
        run: chezmoi apply --dry-run --no-tty --exclude encrypted,externals,scripts
