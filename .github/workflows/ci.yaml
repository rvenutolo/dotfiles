name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install chezmoi
        run: |
          sh -c "$(curl --disable --fail --silent --location --show-error get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Init chezmoi config (runner hostname -> is_server)
        run: |
          mkdir --parents "$(dirname "$HOME/.local/share/chezmoi")"
          ln --symbolic "$GITHUB_WORKSPACE" "$HOME/.local/share/chezmoi"
          chezmoi init
      - name: Verify shellcheck is present (actionlint needs it)
        # actionlint shellchecks the embedded `run:` scripts only when
        # shellcheck is on PATH; without it, it skips them and still exits 0.
        # ubuntu-latest preinstalls it — assert that rather than rely on it
        # silently, so a runner-image change fails loudly instead of quietly
        # dropping lint coverage. (The shellcheck-py hook ships its own binary,
        # so nothing else here depends on the system one.)
        run: shellcheck --version
      - name: Install shfmt (needed by the render-lint-sh-tmpl hook)
        env:
          # renovate: datasource=github-releases depName=mvdan/sh
          SHFMT_VERSION: v3.13.1
          # sha256 of shfmt_${SHFMT_VERSION}_linux_amd64. Renovate can bump the
          # version above but cannot update this digest, so a bump fails this
          # step until a human regenerates it. That is deliberate: a loud
          # failure beats an unverified download. Regenerate with
          #   curl --disable --fail --silent --location \
          #     "https://github.com/mvdan/sh/releases/download/<ver>/shfmt_<ver>_linux_amd64" \
          #     | sha256sum
          SHFMT_SHA256: fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1
        # A released binary rather than `go install`, which compiled shfmt from
        # source on every run (~12s) to obtain a tool upstream already ships.
        run: |
          curl --disable --fail --silent --location --show-error --output /tmp/shfmt \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          echo "${SHFMT_SHA256}  /tmp/shfmt" | sha256sum --check --strict
          install --mode=0755 /tmp/shfmt "$HOME/.local/bin/shfmt"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup-python
        with:
          python-version: '3.14'
      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check pre-commit
      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}
          # The prefix fallback is the whole reason this is not pre-commit/action.
          # That action keys its cache on the same two inputs but supplies no
          # restore-keys, so ANY edit to .pre-commit-config.yaml is a total miss
          # that rebuilds all hook environments from scratch (~2m). Renovate rev
          # bumps touch exactly that file and are this repo's most common PR.
          # With the fallback, a bump restores the previous cache and rebuilds
          # only the environment of the hook whose rev actually changed.
          restore-keys: |
            pre-commit-${{ steps.setup-python.outputs.python-version }}-
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure --color=always
      - name: Prune stale pre-commit hook environments
        # Runs before actions/cache saves the directory at job end. Without it a
        # restored cache accumulates the environment of every rev ever pinned
        # here, since restore-keys means old entries are never evicted by a miss.
        if: always()
        run: pre-commit gc

  render:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [redstar, bluestar, silverstar, io]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install chezmoi
        run: |
          sh -c "$(curl --disable --fail --silent --location --show-error get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Become ${{ matrix.host }}
        run: sudo hostnamectl set-hostname '${{ matrix.host }}'
      - name: Init chezmoi config as ${{ matrix.host }}
        run: |
          mkdir --parents "$(dirname "$HOME/.local/share/chezmoi")"
          ln --symbolic "$GITHUB_WORKSPACE" "$HOME/.local/share/chezmoi"
          chezmoi init
      - name: Render every managed target (dry run)
        run: chezmoi apply --dry-run --no-tty --exclude encrypted,externals,scripts
